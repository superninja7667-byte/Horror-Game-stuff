plugins {
    id 'com.android.application'
}

android {
    namespace 'com.astros.theforest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.astros.theforest'
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
}


// Copy the optional Rootbound Sentinel model for local builds. The APK workflow also copies
// optional model/environment assets before Gradle starts. A missing optional monster file must
// not block an APK build.
tasks.register('copyRootboundSentinel', Copy) {
    onlyIf { rootProject.file('rootbound_sentinel.fbx').exists() }
    from(rootProject.file('rootbound_sentinel.fbx'))
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure { dependsOn('copyRootboundSentinel') }
