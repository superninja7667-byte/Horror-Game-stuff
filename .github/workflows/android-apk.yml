name: Build THE FOREST APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'rootbound_sentinel.fbx'
      - 'tree-low-poly-lowpoly.zip'
      - 'campfire.glb'
      - 'rock.zip'
      - 'player-assets-pack.zip.part*'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify all required game and model files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            app/src/main/assets/index.html
            rootbound_sentinel.fbx
            tree-low-poly-lowpoly.zip
            campfire.glb
            rock.zip
            player-assets-pack.zip.part00
            player-assets-pack.zip.part01
            player-assets-pack.zip.part02
          )
          missing=0
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Missing required THE FOREST asset: $file"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Upload the game HTML, player model chunks and Rootbound FBX before building."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Copy supplied environment and monster models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp tree-low-poly-lowpoly.zip campfire.glb rock.zip rootbound_sentinel.fbx app/src/main/assets/

      - name: Reassemble and install supplied player FBX and textures
        shell: bash
        run: |
          set -euo pipefail
          cat player-assets-pack.zip.part00 player-assets-pack.zip.part01 player-assets-pack.zip.part02 > /tmp/player-assets-pack.zip
          unzip -t /tmp/player-assets-pack.zip
          unzip -oq /tmp/player-assets-pack.zip -d app/src/main/assets
          test -s app/src/main/assets/player-assets/model/player.fbx

      - name: Verify packaged game assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/player-assets/model/player.fbx
          test -s app/src/main/assets/tree-low-poly-lowpoly.zip
          test -s app/src/main/assets/campfire.glb
          test -s app/src/main/assets/rock.zip
          test -s app/src/main/assets/rootbound_sentinel.fbx

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: THE-FOREST-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
