name: Build THE FOREST APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'rootbound_sentinel.fbx'
      - 'tree-low-poly-lowpoly.zip'
      - 'campfire.glb'
      - 'rock.zip'
      - 'player-assets-pack.zip.part*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify game and all required model assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "app/src/main/assets/index.html"
            "player-assets-pack.zip.part00"
            "player-assets-pack.zip.part01"
            "player-assets-pack.zip.part02"
            "tree-low-poly-lowpoly.zip"
            "campfire.glb"
            "rock.zip"
          )
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::error::Required build input is missing: $file"
              exit 1
            fi
          done

          cat player-assets-pack.zip.part00 player-assets-pack.zip.part01 player-assets-pack.zip.part02 > /tmp/player-assets-pack.zip
          unzip -tq /tmp/player-assets-pack.zip
          unzip -oq /tmp/player-assets-pack.zip -d app/src/main/assets
          test -s app/src/main/assets/player-assets/model/player.fbx || {
            echo "::error::Player FBX was not found after extracting the player asset pack."
            exit 1
          }

          unzip -tq tree-low-poly-lowpoly.zip
          unzip -tq rock.zip
          mkdir -p app/src/main/assets
          cp tree-low-poly-lowpoly.zip app/src/main/assets/tree-low-poly-lowpoly.zip
          cp campfire.glb app/src/main/assets/campfire.glb
          cp rock.zip app/src/main/assets/rock.zip

          if [ -s rootbound_sentinel.fbx ]; then
            cp rootbound_sentinel.fbx app/src/main/assets/rootbound_sentinel.fbx
          fi

          echo "All game and model assets verified and installed."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-FOREST-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
